<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riesgo Biológico - Actividad Interactiva</title>

<style>

    * {
        box-sizing: border-box;
    }

    :root {
        --verde-oscuro: #263b2b;
        --verde: #3f6b45;
        --verde-claro: #dfeade;

        --amarillo-seguridad: #e6b93f;
        --amarillo-claro: #fff4c7;

        --rojo-riesgo: #8f3d3d;
        --rojo-claro: #f7dddd;

        --vinotinto: #642f35;

        --crema: #f5f1e8;
        --blanco: #ffffff;

        --gris: #5f665f;
        --borde: #c9c8bd;
    }


    body {
        margin: 0;

        font-family: Arial, Helvetica, sans-serif;

        background:
            radial-gradient(
                circle at top left,
                #e8eadb,
                transparent 45%
            ),
            linear-gradient(
                135deg,
                #f5f1e8,
                #dfe6d8
            );

        color: var(--verde-oscuro);

        min-height: 100vh;
    }


    .screen {
        display: none;

        min-height: 100vh;

        padding: 40px 5vw;
    }


    .screen.active {
        display: flex;
    }


    #intro {
        align-items: center;
        justify-content: center;

        text-align: center;
    }


    .intro-card {

        width: min(950px, 100%);

        padding: 55px 45px 60px;

        background: rgba(255,255,255,0.96);

        border-radius: 32px;

        box-shadow:
            0 20px 60px rgba(38,59,43,0.18);

        border:
            3px solid rgba(230,185,63,0.45);

        position: relative;

        overflow: hidden;
    }


    .intro-card::before {

        content: "";

        position: absolute;

        top: 0;
        left: 0;
        right: 0;

        height: 12px;

        background:
            repeating-linear-gradient(
                -45deg,
                var(--amarillo-seguridad),
                var(--amarillo-seguridad) 18px,
                var(--verde-oscuro) 18px,
                var(--verde-oscuro) 36px
            );
    }


    .sst-container {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 25px;

        margin-bottom: 25px;

        text-align: left;
    }


    .sst-person {

        position: relative;

        width: 135px;

        min-width: 135px;

        height: 190px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: flex-end;
    }


    .sst-head {

        width: 72px;
        height: 72px;

        background: #e7b98a;

        border-radius: 50%;

        position: relative;

        z-index: 2;

        border: 4px solid #263b2b;
    }


    .sst-head::before {

        content: "";

        position: absolute;

        top: -5px;
        left: 4px;

        width: 56px;
        height: 25px;

        background: #3a2a20;

        border-radius: 50% 50% 30% 30%;
    }


    .sst-head::after {

        content: "•  •";

        position: absolute;

        top: 30px;
        left: 18px;

        font-size: 16px;

        letter-spacing: 5px;

        color: #263b2b;
    }


    .sst-helmet {

        position: absolute;

        top: 0;

        width: 92px;
        height: 42px;

        background: var(--amarillo-seguridad);

        border-radius: 55px 55px 15px 15px;

        border: 4px solid var(--verde-oscuro);

        z-index: 3;
    }


    .sst-helmet::after {

        content: "";

        position: absolute;

        bottom: -8px;
        left: -8px;

        width: 100px;
        height: 12px;

        background: var(--amarillo-seguridad);

        border: 4px solid var(--verde-oscuro);

        border-radius: 20px;
    }


    .sst-body {

        width: 110px;
        height: 85px;

        background: var(--verde);

        border-radius: 25px 25px 12px 12px;

        border: 4px solid var(--verde-oscuro);

        position: relative;

        margin-top: 5px;
    }


    .sst-body::before {

        content: "";

        position: absolute;

        left: 15px;
        right: 15px;

        top: 35px;

        height: 9px;

        background: var(--amarillo-seguridad);

        border-radius: 5px;
    }


    .sst-body::after {

        content: "SST";

        position: absolute;

        top: 12px;
        left: 0;
        right: 0;

        text-align: center;

        color: white;

        font-weight: bold;

        font-size: 18px;
    }


    .speech {

        position: relative;

        max-width: 590px;

        background: var(--verde-oscuro);

        color: white;

        padding: 22px 25px;

        border-radius: 22px;

        box-shadow:
            0 10px 25px rgba(38,59,43,0.18);
    }


    .speech::before {

        content: "";

        position: absolute;

        left: -14px;
        top: 38px;

        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;

        border-right: 16px solid var(--verde-oscuro);
    }


    .speech strong {

        color: var(--amarillo-seguridad);

        font-size: 20px;
    }


    .speech p {

        margin: 8px 0 0;

        font-size: 18px;

        line-height: 1.5;
    }


    .biohazard {

        font-size: 70px;

        margin: 5px 0;
    }


    h1 {

        font-size: clamp(42px, 7vw, 76px);

        margin: 5px 0;

        color: var(--verde-oscuro);
    }


    .subtitle {

        font-size: clamp(24px, 4vw, 38px);

        margin: 0 0 35px;

        color: var(--rojo-riesgo);

        font-weight: bold;
    }


    button {

        border: none;

        border-radius: 14px;

        padding: 16px 30px;

        font-size: 18px;

        font-weight: bold;

        cursor: pointer;

        background: var(--rojo-riesgo);

        color: white;

        box-shadow:
            0 8px 18px rgba(143,61,61,0.25);

        transition: 0.2s;
    }


    button:hover {

        transform: translateY(-2px);

        background: var(--vinotinto);
    }


    #game {

        flex-direction: column;

        gap: 20px;
    }


    .header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 20px;
    }


    .header h2 {

        margin: 0;

        font-size: 32px;

        color: var(--verde-oscuro);
    }


    .progress {

        margin-top: 8px;

        font-weight: bold;

        color: var(--rojo-riesgo);
    }


    .instructions {

        background: var(--amarillo-claro);

        border-left:
            7px solid var(--amarillo-seguridad);

        border-radius: 12px;

        padding: 17px 20px;

        box-shadow:
            0 5px 20px rgba(38,59,43,0.08);

        color: var(--verde-oscuro);
    }


    .boards {

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 18px;

        flex: 1;
    }


    .sector {

        background: white;

        border-radius: 20px;

        padding: 18px;

        box-shadow:
            0 8px 25px rgba(38,59,43,0.10);

        min-height: 250px;

        border:
            3px solid transparent;

        transition: 0.2s;
    }


    .sector:hover {

        border-color:
            rgba(230,185,63,0.6);
    }


    .sector h3 {

        margin: 0 0 12px;

        color: var(--verde);

        font-size: 22px;
    }


    .dropzone {

        min-height: 150px;

        border:
            2px dashed var(--borde);

        border-radius: 14px;

        padding: 12px;

        display: flex;

        flex-wrap: wrap;

        align-content: flex-start;

        gap: 8px;

        background: #faf9f3;

        transition: 0.2s;
    }


    .dropzone.over {

        border-color:
            var(--amarillo-seguridad);

        background:
            var(--amarillo-claro);
    }


    .bank {

        background:
            linear-gradient(
                135deg,
                var(--verde-oscuro),
                var(--verde)
            );
